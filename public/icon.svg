<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <path d="M256 32L64 96V240C64 362 146 448 256 480C366 448 448 362 448 240V96L256 32Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Outer Camera Iris / Radar Lines -->
  <circle cx="256" cy="240" r="110" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="240" r="80" stroke="#38bdf8" stroke-width="5" fill="#030712" />
  
  <!-- Camera Lens Iris / Sensor Aperture -->
  <circle cx="256" cy="240" r="46" fill="url(#eyeGrad)" />
  <circle cx="256" cy="240" r="24" fill="#090d16" />
  <circle cx="270" cy="226" r="8" fill="#ffffff" opacity="0.9" />

  <!-- Privacy Warning Status Beacon -->
  <circle cx="370" cy="130" r="22" fill="url(#alertGrad)" stroke="#ffffff" stroke-width="3" />
  <path d="M370 120V132M370 138V140" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>
